name: Build Aniku APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create .env file
        run: |
          echo "GEMINI_API_KEY=placeholder" > .env

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Aniku-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Build Perf APK (release-optimized, for scroll/performance testing)
        run: gradle assemblePerf --no-daemon

      - name: Upload Perf APK
        uses: actions/upload-artifact@v4
        with:
          name: Aniku-perf
          path: app/build/outputs/apk/perf/*.apk
          retention-days: 7

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks

      - name: Build Release AAB (for Play Store)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Aniku-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 7

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Aniku-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Remove keystore file
        if: always()
        run: rm -f my-upload-key.jks
